name: Test

on:
  pull_request

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate templates
        run: pnpm run validate:templates

      - name: Build
        run: pnpm run build

      - name: Accessibility audit
        run: pnpm run check:accessibility

  preview:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.pages.outputs.url }}
    steps:
      # Cloudflare builds this site straight from git and reports the result as a
      # check run. Reading the preview URL back off that check avoids a second
      # deploy and needs no Cloudflare credentials.
      - name: Wait for the Cloudflare Pages preview
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in $(seq 1 45); do
            run=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "Cloudflare Pages")] | sort_by(.started_at) | last' 2>/dev/null || echo "")
            conclusion=$(printf '%s' "$run" | jq -r '.conclusion // "pending"' 2>/dev/null || echo "pending")

            case "$conclusion" in
              success)
                url=$(printf '%s' "$run" | jq -r '.output.summary' \
                  | grep -oE 'https://[a-z0-9-]+\.joshghent\.pages\.dev' | head -1)
                if [ -z "$url" ]; then
                  echo "The Cloudflare check succeeded but carried no preview URL."
                  exit 1
                fi
                echo "url=${url}" >> "$GITHUB_OUTPUT"
                echo "Preview deployed to ${url}"
                exit 0
                ;;
              failure | cancelled | timed_out | action_required)
                echo "Cloudflare Pages did not deploy this commit: ${conclusion}"
                exit 1
                ;;
            esac

            echo "Waiting for Cloudflare Pages (attempt ${attempt}, currently ${conclusion})"
            sleep 20
          done

          echo "Gave up waiting for the Cloudflare Pages preview."
          exit 1

  carbon:
    runs-on: ubuntu-latest
    needs: preview
    steps:
      - name: Calculate CO2 🌱
        uses: GeopJr/CO2@v1
        with:
          url: ${{ needs.preview.outputs.url }}
          renewable: true
          comment: true
          token: ${{ github.token }}

  lighthouse:
    runs-on: ubuntu-latest
    needs: preview
    steps:
      - uses: actions/checkout@v4

      - name: Add comment to PR
        id: loading_comment_to_pr
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ github.event.pull_request.number }}
          header: lighthouse
          message: |
            Running Lighthouse audit...

      - name: Audit URLs using Lighthouse
        id: lighthouse_audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ needs.preview.outputs.url }}
            ${{ needs.preview.outputs.url }}/blog/
            ${{ needs.preview.outputs.url }}/cv/
            ${{ needs.preview.outputs.url }}/zsh-speed/
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Format lighthouse score
        id: format_lighthouse_score
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const result = ${{ steps.lighthouse_audit.outputs.manifest }}[0].summary
            const links = ${{ steps.lighthouse_audit.outputs.links }}

            const formatResult = (res) => Math.round((res * 100))
            Object.keys(result).forEach(key => result[key] = formatResult(result[key]))

            const score = res => res >= 90 ? '🟢' : res >= 50 ? '🟠' : '🔴'

            const comment = [
                `⚡️ [Lighthouse report](${Object.values(links)[0]}) for the changes in this PR:`,
                '| Category | Score |',
                '| --- | --- |',
                `| ${score(result.performance)} Performance | ${result.performance} |`,
                `| ${score(result.accessibility)} Accessibility | ${result.accessibility} |`,
                `| ${score(result['best-practices'])} Best practices | ${result['best-practices']} |`,
                `| ${score(result.seo)} SEO | ${result.seo} |`,
                ' ',
                `*Lighthouse ran on [${Object.keys(links)[0]}](${Object.keys(links)[0]})*`
            ].join('\n')

             core.setOutput("comment", comment);

      - name: Add comment to PR
        id: comment_to_pr
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ github.event.pull_request.number }}
          header: lighthouse
          message: |
            ${{ steps.format_lighthouse_score.outputs.comment }}
